<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="25%" stop-color="rgba(254,243,199,0.1)"/>
      <stop offset="75%" stop-color="rgba(251,191,36,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>
    <linearGradient id="siltCartridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="600" fill="url(#bgGrad)"/>
  
  <path d="M 40 80 L 360 80" stroke="#334155" stroke-width="4"/>
  <rect x="180" y="20" width="40" height="60" fill="#64748b"/>
  <circle cx="200" cy="50" r="14" fill="#3b82f6"/>
  <text x="200" y="54" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">INLET</text>

  <path d="M 130 90 L 270 90 L 255 140 L 145 140 Z" fill="#0284c7" filter="url(#shadow)"/>
  <rect x="175" y="100" width="50" height="25" rx="4" fill="#0369a1"/>
  <text x="200" y="117" fill="#e0f2fe" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">AquaVigil Sentry</text>
  <text x="200" y="132" fill="#93c5fd" font-family="sans-serif" font-size="9" text-anchor="middle">10" SEDIMENT PRE-FILTER</text>

  <!-- Transparent Canister Body -->
  <rect x="140" y="140" width="120" height="380" rx="12" fill="url(#glassGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="142" y="145" width="116" height="370" rx="10" fill="#d97706" fill-opacity="0.15"/>

  <!-- Silt-fouled Filter Core -->
  <rect x="160" y="155" width="80" height="350" rx="6" fill="url(#siltCartridge)" stroke="#78350f" stroke-width="1"/>
  
  <!-- Silt sediment banding -->
  <ellipse cx="200" cy="200" rx="38" ry="8" fill="#78350f" fill-opacity="0.4"/>
  <ellipse cx="200" cy="260" rx="39" ry="12" fill="#92400e" fill-opacity="0.5"/>
  <ellipse cx="200" cy="330" rx="37" ry="10" fill="#78350f" fill-opacity="0.45"/>
  <ellipse cx="200" cy="410" rx="39" ry="15" fill="#451a03" fill-opacity="0.6"/>
  <ellipse cx="200" cy="480" rx="38" ry="14" fill="#78350f" fill-opacity="0.55"/>

  <!-- Canister Bottom Sump sediment collection -->
  <path d="M 145 490 L 255 490 L 245 520 L 155 520 Z" fill="#78350f" fill-opacity="0.4"/>
  <path d="M 155 520 L 245 520 L 235 550 L 165 550 Z" fill="#0369a1"/>

  <!-- Glass Light Reflection -->
  <path d="M 148 150 L 154 150 L 154 510 L 148 510 Z" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Status Overlay Badge -->
  <rect x="50" y="540" width="300" height="42" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="75" cy="561" r="8" fill="#f59e0b"/>
  <text x="95" y="556" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">SAMPLE B: MODERATE SILT ACCUMULATION</text>
  <text x="95" y="572" fill="#fef3c7" font-family="sans-serif" font-size="10">Visual Fouling Index: 0.52 | Severity: MODERATE | Replace Recommended</text>
</svg>
