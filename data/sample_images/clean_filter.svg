<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="25%" stop-color="rgba(224,242,254,0.1)"/>
      <stop offset="75%" stop-color="rgba(186,230,253,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </linearGradient>
    <linearGradient id="cleanCartridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)"/>
  
  <!-- Under-sink Cabinet Context -->
  <path d="M 40 80 L 360 80" stroke="#334155" stroke-width="4"/>
  <rect x="180" y="20" width="40" height="60" fill="#64748b"/>
  <circle cx="200" cy="50" r="14" fill="#3b82f6"/>
  <text x="200" y="54" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">INLET</text>

  <!-- Mounting Bracket Head -->
  <path d="M 130 90 L 270 90 L 255 140 L 145 140 Z" fill="#0284c7" filter="url(#shadow)"/>
  <rect x="175" y="100" width="50" height="25" rx="4" fill="#0369a1"/>
  <text x="200" y="117" fill="#e0f2fe" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">AquaVigil Sentry</text>
  <text x="200" y="132" fill="#93c5fd" font-family="sans-serif" font-size="9" text-anchor="middle">10" SEDIMENT PRE-FILTER</text>

  <!-- Transparent Canister Body -->
  <rect x="140" y="140" width="120" height="380" rx="12" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <!-- Water Fill -->
  <rect x="142" y="145" width="116" height="370" rx="10" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Clean Spun Polypropylene Filter Core -->
  <rect x="160" y="155" width="80" height="350" rx="6" fill="url(#cleanCartridge)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Clean Core Grooves -->
  <line x1="160" y1="190" x2="240" y2="190" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="160" y1="230" x2="240" y2="230" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="160" y1="270" x2="240" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="160" y1="310" x2="240" y2="310" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="160" y1="350" x2="240" y2="350" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="160" y1="390" x2="240" y2="390" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="160" y1="430" x2="240" y2="430" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="160" y1="470" x2="240" y2="470" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Glass Light Reflection Highlights -->
  <path d="M 148 150 L 154 150 L 154 510 L 148 510 Z" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M 248 150 L 250 150 L 250 510 L 248 510 Z" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Canister Bottom Sump -->
  <path d="M 155 520 L 245 520 L 235 550 L 165 550 Z" fill="#0369a1"/>

  <!-- Status Overlay Badge -->
  <rect x="50" y="540" width="300" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="75" cy="561" r="8" fill="#10b981"/>
  <text x="95" y="556" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold">SAMPLE A: NEW CARTRIDGE (ROUTINE)</text>
  <text x="95" y="572" fill="#d1fae5" font-family="sans-serif" font-size="10">Visual Fouling Index: 0.08 | Severity: LOW | Fibers: Clean</text>
</svg>
